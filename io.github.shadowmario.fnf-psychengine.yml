app-id: io.github.shadowmario.fnf-psychengine
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: io.github.shadowmario.fnf-psychengine.sh

finish-args:
  # gamepad support
  - --device=all
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Audio
  - --socket=pulseaudio

modules:
  - name: fnf-psychengine
    sources:
      - type: file
        url: https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/refs/tags/1.0.4/assets/meta/io.github.shadowmario.fnf-psychengine.desktop
        sha256: 55776d11221dbcd960b89e5c916b0bf796e92119182198e6442999da9b99d7f6
      - type: file
        url: https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/refs/tags/1.0.4/assets/meta/io.github.shadowmario.fnf-psychengine.png
        sha256: 75e6f7be86648b49a96a219a572f6663fb6466e2cca342aab525abeb23f250ea
      - type: file
        url: https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/refs/tags/1.0.4/assets/meta/io.github.shadowmario.fnf-psychengine.metainfo.xml
        sha256: 621f8849d9dd5a1bd69413870f448bb18ec562a7feff1e267b197c110d88a5f5
      # launcher script
      - type: script
        dest-filename: io.github.shadowmario.fnf-psychengine.sh
        commands:
          - zenity --error --title "PsychEngine is no longer maintained"
            --text "The PsychEngine fork of FNF has been discontinued. There is a community provided Flatpak for mainline FNF available at <tt><b>https://github.com/Pucas01/FunkinFlatpak</b></tt>."

    builddir: true
    buildsystem: simple
    build-commands:
      # build
      - |
        install -Dm755 io.github.shadowmario.fnf-psychengine.sh -t /app/bin/
        desktop-file-edit --set-key=Exec --set-value=io.github.shadowmario.fnf-psychengine.sh io.github.shadowmario.fnf-psychengine.desktop
        install -Dm 644 io.github.shadowmario.fnf-psychengine.desktop -t /app/share/applications
        install -Dm 644 io.github.shadowmario.fnf-psychengine.png -t /app/share/icons/hicolor/512x512/apps
        install -Dm 644 io.github.shadowmario.fnf-psychengine.metainfo.xml -t /app/share/metainfo
